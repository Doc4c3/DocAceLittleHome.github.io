name: GitHub Pages

on:
  push:
    branches:
      # The branch where the project source code resides
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌌 Build Valaxy Blog
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: 🪤 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          # force_orphan replaces the whole gh-pages branch on every deploy;
          # without this the CNAME file is wiped and the custom domain is lost.
          cname: docacer.top
